# The macOS and Linux builds, tested: run by hand, or on a push to a branch porting them
# (`os/...`). Releases are release.yml's.
name: unix

on:
  workflow_dispatch:
  push:
    branches: ["os/**", "t3/mac-release-build"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      # The oldest macOS the binary runs on; Prism's CMake build and rustc both follow it.
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      # Prism's C23 needs CMake 4.2 or newer.
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || brew upgrade cmake
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libspeechd-dev pkg-config g++-13
          # Prism needs GCC 13's C++ library; build.rs links it in whole (glibc 2.35 is all it asks).
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-13" >> "$GITHUB_ENV"
          pipx install "cmake>=4.2"
      - name: Build
        run: cargo build --release
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --lib
      # The package's promise in manual/known-issues.md: glibc 2.35, as Ubuntu 22.04 and Debian
      # 12 have, and no system libstdc++ at all (build.rs links it in).
      - name: Needs no newer glibc than 2.35 (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          ldd target/release/pa3ds
          objdump -T target/release/pa3ds | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | tee glibc
          [ "$(printf '%s\nGLIBC_2.35\n' "$(cat glibc)" | sort -V | tail -1)" = GLIBC_2.35 ]
          ! objdump -T target/release/pa3ds | grep -q GLIBCXX
      - name: Starts and stops with no Azahar
        if: ${{ !cancelled() }}
        run: ./target/release/pa3ds --silent --no-log --seconds 3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pa3ds-${{ runner.os }}
          path: |
            target/release/pa3ds
            target/release/tape
          if-no-files-found: warn
