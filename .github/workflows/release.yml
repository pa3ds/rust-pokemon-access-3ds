# Pushing a version tag (`/release` does, `.claude/skills/release/SKILL.md`) builds the release zip
# on Windows and publishes it as that tag's GitHub release, its description the tag's section of
# CHANGELOG.md, then adds the macOS and Linux packages to it. Every packaged pa3ds offers the
# newest release to its player when it starts (`src/update.rs`).
name: release

on:
  push:
    tags: ["v*"]
  # Run on a branch, it builds the zip as an artifact and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Prism's C23 needs CMake 4.2 or newer; Visual Studio's own is 3.31.
      - name: CMake
        run: |
          python -m pip install "cmake>=4.2"
          python -c "import cmake; print(cmake.CMAKE_BIN_DIR)" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: The tag names Cargo.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Cargo.toml says $version, the tag $GITHUB_REF_NAME"; exit 1; }
      # /release ran the tests before tagging.
      - name: Package
        run: powershell -ExecutionPolicy Bypass -File tools\package.ps1 -SkipTests
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="[$version]" '/^## /{ if (p) exit; p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "target/package/pa3ds-$version-windows.zip" \
            --title "pa3ds $version" --notes-file notes.md --verify-tag
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: package
          path: target/package/*.zip

  # The experimental macOS and Linux packages, added to the release the Windows job made, with the
  # same build tools as unix.yml.
  unix:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package: macos.zip
          - os: ubuntu-24.04
            package: linux.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake || brew upgrade cmake
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libspeechd-dev pkg-config
          pipx install "cmake>=4.2"
      - name: Package
        run: sh tools/package.sh --skip-tests
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "target/package/pa3ds-${GITHUB_REF_NAME#v}-${{ matrix.package }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: package-${{ runner.os }}
          path: target/package/pa3ds-*-${{ matrix.package }}
