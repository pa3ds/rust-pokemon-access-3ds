# A macOS build, run by hand: does the crate compile and pass its tests there? It publishes
# nothing. The binary it uploads reads memory and speaks, but has no hotkeys, sounds, window
# checks or settings dialogs yet: those are Win32 only, stubbed out under cfg(not(windows)).
name: macos

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Prism's C23 needs CMake 4.2 or newer.
      - name: CMake
        run: |
          brew install cmake || brew upgrade cmake
          cmake --version
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --lib
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pa3ds-macos
          path: |
            target/release/pa3ds
            target/release/tape
          if-no-files-found: warn
