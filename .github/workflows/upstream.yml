# Keeps open issues labelled `upstream` saying what the port has not caught up with yet, each
# ported up to the commit its title names. Upstream's own workflow (`.github/workflows/port.yml`
# there) dispatches `upstream-push` here on every push to its main; a push here that changes
# port.toml runs this too, and closes each issue whose commit port.toml has reached. An issue
# labelled `in progress` is never rewritten: what upstream pushes after it is claimed goes in an
# issue of its own, from where the claimed one ends. Rewritten under a developer while they
# ported, the issue nearly closed at the commit their agent had read, leaving what was pushed
# meanwhile in no issue. PORT_SYNC_TOKEN reads the private upstream repository.
name: upstream

on:
  repository_dispatch:
    types: [upstream-push]
  push:
    paths: [port.toml]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: upstream

jobs:
  issue:
    # A port.toml marked on a work-in-progress branch has not landed yet.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pokemon-access-3ds
          token: ${{ secrets.PORT_SYNC_TOKEN }}
          path: upstream
          fetch-depth: 0
      - name: Close, rewrite or open the issues
        env:
          GH_TOKEN: ${{ github.token }}
          PA3DS_PYTHON: upstream
          UPSTREAM_REPO: ${{ github.repository_owner }}/pokemon-access-3ds
        run: |
          pinned=$(python -c "import tomllib; print(tomllib.load(open('port.toml', 'rb'))['upstream'])")
          head=$(git -C upstream rev-parse HEAD)
          from=$pinned claimed="" free=""
          # Oldest first: each issue's commit is the last word of its title.
          gh issue list --label upstream --state open --json number,title,labels --jq \
            'sort_by(.number)[] | "\(.number) \(.title | split(" ") | last) \(any(.labels[]; .name == "in progress"))"' \
            > issues.txt
          while read -r number commit taken; do
            if git -C upstream merge-base --is-ancestor "$commit" "$pinned" 2>/dev/null; then
              gh issue close "$number" --comment "port.toml now matches upstream ${pinned:0:7}." </dev/null
            elif [ "$taken" = true ]; then
              from=$(git -C upstream rev-parse "$commit") claimed=$number
            else
              free=$number
            fi
          done < issues.txt
          # Nothing left to port, or all of it in an issue already claimed.
          [ "$from" = "$head" ] && exit 0
          {
            echo "Upstream is at $UPSTREAM_REPO@$head; port.toml matches $UPSTREAM_REPO@$pinned."
            if [ -n "$claimed" ]; then
              echo "#$claimed, in progress, ports up to $UPSTREAM_REPO@$from; this issue starts there."
            fi
            echo "Compare: https://github.com/$UPSTREAM_REPO/compare/$from...$head"
            echo
            echo "Port it as AGENTS.md's *Keeping up with upstream* says, up to the commit in this"
            echo "issue's title. It closes itself when a push to the default branch brings port.toml"
            echo "there; never close it by hand."
            echo
            echo '```'
            # An issue body holds 65536 characters; the whole refactor round's status was 16k.
            python tools/sync.py status "$from" | sed 's#git -C upstream#git -C ../pokemon-access-3ds#' | head -c 60000
            echo '```'
          } > body.md
          title="Port upstream up to ${head:0:7}"
          if [ -n "$free" ]; then
            gh issue edit "$free" --title "$title" --body-file body.md
          else
            gh issue create --label upstream --title "$title" --body-file body.md
          fi
