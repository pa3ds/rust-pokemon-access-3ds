# What pa3ds calls the choices X's opening draws without a word: the boy or the girl, each in a
# mirror, and then the three looks of the one chosen, each a portrait in a frame. The game names
# none of them; these are said as the cursor comes onto each (`games.xy.intro`).
#
# Read off the replays' pictures, enlarged (x_character-desc.ctm and x_character-desc2.ctm,
# 2026-10-15); the shoes from the camera's pan up the chosen one's mirror after the name, since
# the mirrors' own screen cuts both off at the shins. The three looks of each differ only in skin, hair and eyes: every boy wears the red
# cap and blue jacket the boy in the mirror does, and every girl the pink hat and black blouse.

[gender]
boy = "Boy, fair skin, short black hair, blue-grey eyes, red cap with dark sunglasses on top, royal-blue zip-up track jacket with a high collar and white stripes, black bag strap across the chest, dark-blue jeans, grey lace-up boots"
girl = "Girl, fair skin, long wavy honey-blonde hair, blue eyes, rose-pink hat with white-framed sunglasses on top, black sleeveless blouse with a bow at the collar, red high-waisted pleated skirt, pink quilted handbag, black thigh-high stockings, grey high-top lace-up shoes with a buckled ankle strap"

[boy]
left = "Pale skin, platinum-blond hair in spiky strands, bright blue eyes, small closed smile"
middle = "Fair skin, black hair in a short bob, blue-grey eyes, open cheerful smile"
right = "Brown skin, dark grey-black hair in a short bob, amber-brown eyes, calm closed smile"

[girl]
left = "Pale skin, long platinum-blonde hair, bright blue eyes, open smile with red lips"
middle = "Fair skin, long wavy honey-blonde hair, blue-grey eyes, gentle closed smile"
right = "Brown skin, long wavy dark grey-black hair, amber-brown eyes, gentle closed smile"
