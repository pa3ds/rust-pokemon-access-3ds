# What Omega Ruby and Alpha Sapphire show without words, in pa3ds's own words, said under
# [pa3ds.ui] descriptions.
#
# A scene follows a line of the game's text in a zone, or in none before the player has arrived
# anywhere, as in the opening: `story:402:30` is the story text's file 402,
# line 30, the same line in every language, and `text:147:67` the rest of the game's text
# (`games.common.scenes`). Its beats are said one after another: a beat with `demo` waits for a
# scene of the game's own to start, one with `zone` for the player to arrive there, then `at`
# seconds. A name the game shows is never written here: `{pokemon:383}` is the game's own word,
# out of the player's ROM, as are `{trainer:N}`, `{item:N}` and `{place:N}`.
#
# Each version plays its own scenes in rooms of its own, twin zones of one layout (Seafloor
# Cavern's 0x6f in Omega Ruby, 0x6e in Alpha Sapphire), but a line said in a zone both share, as on
# Route 128, is one version's only with its `title`: 0x000400000011C400 Omega Ruby,
# 0x000400000011C500 Alpha Sapphire.
#
# Each scene was described from screenshots of a replay (spike 203, Omega Ruby's
# movie40_groudon_awakens and movie41_cave_of_origin, and Alpha Sapphire's movie2_cave_of_origin);
# the seconds are from the moment its demo or line came there.

# The opening, before the player is anywhere, so in no zone: the professor's lines are the rest of
# the game's text, file 118, and the stretches between them where he says nothing are described
# (OR_character-desc.ctm, 2026-10-15).
#
# "And this...is what we call a POKéMON.", then 12 s without a word.
[[scene]]
after = "text:118:42"

[[scene.beat]]
at = 1
text = "{pokemon:298} appears beside the professor: small, round and blue, with big round ears and a blue ball on the end of its tail."

[[scene.beat]]
at = 5
text = "The picture pulls back. The professor is on the little screen of a yellow handheld with a carrying handle, lying in the dark back of a moving truck among bunk beds, cardboard boxes and a plush mouse doll."

[[scene.beat]]
at = 10
text = "Outside, the truck's brown back doors rattle along a dirt road through a sunny forest."

# "...But that's enough about me!", then 21 s without a word.
[[scene]]
after = "text:118:48"

[[scene.beat]]
at = 1
text = "{pokemon:357} beats its broad leaf wings and flies off between the trees. The view sinks down into tall grass."

[[scene.beat]]
at = 9
text = "A {pokemon:278} sweeps up out of the treetops on long, thin white wings, and a small dark bird climbs after it into the blue sky."

[[scene.beat]]
at = 15
text = "They fly up into the sun, and its light floods everything white."

[[scene.beat]]
at = 18
text = "Back in the dark truck, a bright line of light shines between the closed doors onto the handheld, where the professor waits on the screen."

# "...You're the one who's moving to Littleroot Town, where I live!", then 8 s without a word. The
# same words are line 56 too, and either matches.
[[scene]]
after = "text:118:55"

[[scene.beat]]
text = "On the handheld's screen you are shown from behind, then you turn round to face the front with a smile."

[[scene.beat]]
at = 4
text = "The screen changes to a map of the region: green islands in a blue sea, its towns marked in red."

[[scene.beat]]
at = 7
text = "The handheld is set down, and the dark truck rumbles on."

# "...Come see me in my Pokémon Lab!", then 11 s without a word until the player stands in the
# truck, zone 0x18f.
[[scene]]
after = "text:118:60"

[[scene.beat]]
at = 2
text = "The truck's back doors swing wide, and daylight pours in until everything is white."

[[scene.beat]]
zone = 0x18f
text = "The light fades. You stand in the back of the parked truck among cardboard boxes and furniture, with sunlight spilling in through the open doors."

# Seafloor Cavern, zone 0x6f: Archie's "Augh... You...", after Maxie's battle and before Groudon
# wakes, a demo of 65 s.
[[scene]]
after = "story:402:30"
zone = 0x6f

[[scene.beat]]
text = "{trainer:235} walks to the edge of the lava, where {pokemon:383} lies curled up, grey as stone."

[[scene.beat]]
demo = true
at = 6
text = "{trainer:235} holds up the {item:534}. It blazes with red light, and cracks of light run across {pokemon:383}'s stone shell."

[[scene.beat]]
at = 15
text = "{pokemon:383} rises out of the lava, red again. It opens its eyes and looks up at the cavern roof."

[[scene.beat]]
at = 30
text = "It towers over the lava as {trainer:235} and you watch from the shore."

[[scene.beat]]
at = 40
text = "{pokemon:383} bursts out into the open sky over the sea in a flash of light."

[[scene.beat]]
at = 50
text = "The sky turns a fierce burning yellow, and {pokemon:383} roars."

# Tabitha's "Child! You're coming, too! Hurry up!": the lava pool is empty, and everyone runs out
# of the cavern onto Route 128, zone 0x39.
[[scene]]
after = "story:402:42"
zone = 0x6f

[[scene.beat]]
text = "The lava pool is empty. {pokemon:383} is gone."

[[scene.beat]]
zone = 0x39
text = "The sky blazes white and gold. You stand on a sandbar in the sea with {trainer:178}, {trainer:235} and {trainer:691}, under a burning sun."

# Route 128: Tabitha's "Let's go. Boss Maxie...".
[[scene]]
after = "story:148:30"
zone = 0x39
title = 0x000400000011C400

[[scene.beat]]
text = "{trainer:235} and {trainer:691} leave."

# Archie's "So...I'll be waitin' for you in Sootopolis.", before Steven comes.
[[scene]]
after = "story:148:58"
zone = 0x39
title = 0x000400000011C400

[[scene.beat]]
text = "{trainer:178} leaves. You stand alone on the sandbar, looking into the glare."

[[scene.beat]]
at = 9
text = "Someone flies down out of the glare and lands beside you."

# Steven's "Good luck to you."
[[scene]]
after = "story:148:46"
zone = 0x39
title = 0x000400000011C400

[[scene.beat]]
text = "{trainer:557} flies off into the glare."

# The Cave of Origin's deepest floor, zone 0x76, each time the player comes down into it: the
# only way on is north, where the floor narrows onto a ledge at the magma, and the scene where the
# Magma Suit goes on starts as the player walks into that narrowing (an invisible trigger seven
# cells wide at (17, 24), which fills it). Nothing stands there; a sighted player sees the floor
# narrow toward the glow.
[[scene]]
zone = 0x76

[[scene.beat]]
text = "The stairs come down at the east end of a passage. It runs west, then north through a gap into a wide hall, which narrows at its north end toward a river of glowing magma."

# The Magma Suit goes on as the scene starts, and its line comes after.
[[scene]]
after = "story:395:5"
zone = 0x76

[[scene.beat]]
text = "The suit is red, with heavy boots and a round helmet you look out through."

# "fitted the suit with the Blue Orb!"
[[scene]]
