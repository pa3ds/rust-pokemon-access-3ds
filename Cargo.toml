[package]
name = "pa3ds"
version = "0.2.1"
edition = "2024"
description = "Screen reader accessibility layer for 3DS Pokemon games running under the Azahar emulator"
license = "MIT"
default-run = "pa3ds"
# The tests mirror the Python checkout's tests/ folder and are compiled into the library's own
# test build (`src/lib.rs`), where they can reach crate-private items as pytest reached `_names`.
autotests = false

[dependencies]
flate2 = "1"
indexmap = "2"
prismer = { version = "0.1.4", features = ["static"] }
regex = "1"
sha1 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
toml = { version = "0.8", features = ["preserve_order"] }
unicode-general-category = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
# Python's ints never overflow, and a product of two words read out of freed memory overflows an
# i64: checked, it panics and the runtime takes it for a reader's failure, logged, rather than
# reading on with a wrapped number nothing would notice.
overflow-checks = true
