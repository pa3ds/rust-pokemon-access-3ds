# The scenes Omega Ruby and Alpha Sapphire show without words, and when each beat of a scene's
# description is said, under [pa3ds.ui] descriptions. What each beat says is in each language's
# `scenes.ftl`, by the beat's `id` (ADR-0040): this file is every language's.
#
# A scene follows a line of the game's text in a zone, or in none before the player has arrived
# anywhere, as in the opening: `story:402:30` is the story text's file 402, line 30, the same line
# in every language, and `text:147:67` the rest of the game's text (`games.common.scenes`); a list
# of lines, `["text:147:67", "text:148:1"]`, is any one of them. A scene with no line is said as the player arrives in its zone, or with `trigger` as they first step
# onto that trigger of the zone's. Its beats are said one after another: a beat with `demo` waits
# for a scene of the game's own to start (a demo, the Hall of Fame, the credits), one with `zone`
# for the player to arrive there, or in any of a list, `[0xe0, 0xe2]`, a boy's room or a girl's,
# then `at` seconds. A beat's `id` is a label, not a place, and one scene's alone: one put between
# two others takes a new label, `or-groudon-wakes-2b`, and no other beat's words move.
#
# Each version plays its own scenes in rooms of its own, twin zones of one layout (Seafloor
# Cavern's 0x6f in Omega Ruby, 0x6e in Alpha Sapphire), but a line said in a zone both share, as on
# Route 128, is one version's only with its `title`: 0x000400000011C400 Omega Ruby,
# 0x000400000011C500 Alpha Sapphire.
#
# Each scene was described from screenshots of a replay (spike 203, Omega Ruby's
# movie40_groudon_awakens and movie41_cave_of_origin, and Alpha Sapphire's movie2_cave_of_origin;
# spike 222, Omega Ruby's movies 48 to 53, Victory Road to the Delta Episode's opening, and Alpha
# Sapphire's movie4_hall_of_fame and movie5_delta_episode_intro; Omega Ruby's movies 1 and 4 and
# Alpha Sapphire's scene_granite_cave_mural, 2026-10-19; spike 237, Omega Ruby's or_sky_pillar_6 and
# or_sky_pillar_7, 2026-10-22, and or_sky_pillar_7 and Alpha Sapphire's as_sky_pillar_7 again from
# states saved while recording them, 2026-10-23); the seconds are from the moment its demo, line,
# arrival or trigger came there.

# Each version's intro and title screen, before the player is anywhere, each scene said as the app
# that plays it starts and let go as another starts: A skips the intro straight to the title
# screen, and the rest of it goes unsaid. Seconds are from the app's start, by the game's own
# frames (spike 236, or_intro_and_title_screen, 2026-10-21).
#
# The intro's first part, the forest, Latios and the boy on his bike, played on the field's engine.
