# Prism Tower's Gym (spike 252): each quiz room shows a picture in a white frame for a few seconds
# before Bonnie's question, described by a beat after the question, and then the booths whose
# numbers answer it. Zones 0x4f to 0x52, story 404 to 401; the pictures are from the screens of
# the rig's own run through the Gym, 2026-10-27.
[[scene]]
after = "story:404:2"
zone = 0x4f

[[scene.beat]]
id = "prism-quiz-1"

[[scene]]
after = "story:403:1"
zone = 0x50

[[scene.beat]]
id = "prism-quiz-2"

[[scene]]
