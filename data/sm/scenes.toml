# The scenes Sun shows without words, and when each beat of a scene's description is said, under
# [pa3ds.ui] descriptions. What each beat says is in each language's `scenes.ftl`, by the beat's
# `id` (ADR-0040): this file is every language's.
#
# Sun numbers its demos (`App::AppDemo::AppDemoProc` +0x24), so a scene here is said over the demo
# it plays as, `demo = 6`, where Omega Ruby's follows a line of the game's text
# (`games.common.scenes`). Its beats are said one after another, each `at` seconds after the demo
# started or the player arrived in the `zone` a beat last waited for.
#
# Described from screenshots of sun_1.ctm at real speed (2026-09-30), and carried over from a
# branch's demos.toml.

# The chase after Kukui's call, demo 6, unskippable. Before it the camera leaves the monitor for
# the desk; the game says "Three months later..." itself at 71 s, and the field takes over at about
# 89 s with the arrival, which plays without the player until Mom speaks at about 114 s. The
# arrival's beats wait for the field, Route 1's zone 0x0, which came 91 s after the demo started in
# movie1_opening.ctm (2026-10-13).
[[scene]]
demo = 6

[[scene.beat]]
id = "chase-1"

[[scene.beat]]
at = 2
id = "chase-2"

[[scene.beat]]
at = 10
id = "chase-3"

[[scene.beat]]
at = 19
id = "chase-4"

[[scene.beat]]
at = 30
id = "chase-5"

[[scene.beat]]
at = 40
id = "chase-6"

[[scene.beat]]
at = 50
id = "chase-7"

[[scene.beat]]
at = 55
id = "chase-8"

[[scene.beat]]
at = 61
id = "chase-9"

[[scene.beat]]
at = 76
id = "chase-10"

[[scene.beat]]
zone = 0x0
at = 1
id = "chase-11"

[[scene.beat]]
at = 6
id = "chase-12"
